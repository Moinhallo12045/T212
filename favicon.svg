<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1f38" />
      <stop offset="100%" stop-color="#060911" />
    </radialGradient>
    <linearGradient id="trajGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="6"/>
  <!-- Multi-colored Pie Segments Ring -->
  <g filter="url(#glow)">
    <!-- Tech: Sky Blue -->
    <path d="M 256 96 A 160 160 0 0 1 416 256" fill="none" stroke="#38bdf8" stroke-width="42" stroke-linecap="round"/>
    <!-- Dividends: Emerald -->
    <path d="M 416 256 A 160 160 0 0 1 256 416" fill="none" stroke="#34d399" stroke-width="42" stroke-linecap="round"/>
    <!-- Pies: Purple -->
    <path d="M 256 416 A 160 160 0 0 1 116 336" fill="none" stroke="#a855f7" stroke-width="42" stroke-linecap="round"/>
    <!-- Cash/Growth: Amber -->
    <path d="M 116 336 A 160 160 0 0 1 126 200" fill="none" stroke="#fbbf24" stroke-width="42" stroke-linecap="round"/>
  </g>
  <!-- Upward Trend Trajectory -->
  <path d="M 140 340 L 220 250 L 280 290 L 375 160" fill="none" stroke="url(#trajGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow Head -->
  <polyline points="330 155 385 150 380 205" fill="none" stroke="#34d399" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Beacon Dot -->
  <circle cx="385" cy="150" r="18" fill="#34d399" filter="url(#glow)"/>
  <!-- Center Radar Pulse -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" opacity="0.9"/>
</svg>