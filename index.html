<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading 212 Dashboard</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --border: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.12);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1.5rem 1rem; line-height: 1.5; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.3rem; font-weight: 700; color: #fff; }
    h1 span { color: var(--accent); }
    
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.5rem; }
    
    .form-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
    @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
    label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.35rem; font-weight: 600; text-transform: uppercase; }
    input[type="text"], input[type="password"] {
      width: 100%; background: #060911; border: 1px solid var(--border); border-radius: 8px;
      padding: 0.65rem 0.85rem; color: #fff; font-size: 0.9rem; outline: none;
    }
    input:focus { border-color: var(--accent); }
    
    .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    button {
      background: var(--accent); color: #000; border: none; border-radius: 8px;
      padding: 0.65rem 1.2rem; font-weight: 600; font-size: 0.85rem; cursor: pointer;
    }
    button.secondary { background: #1e293b; color: #fff; }
    button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
    .kpi-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 0.4rem; }
    .kpi-val { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .kpi-sub { font-size: 0.8rem; margin-top: 0.3rem; color: var(--text-muted); }
    
    .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .badge.up { background: var(--success-bg); color: var(--success); }
    .badge.down { background: var(--danger-bg); color: var(--danger); }
    
    .status { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.85rem; display: none; }
    .status.error { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger); display: block; }
    .status.success { background: var(--success-bg); border: 1px solid var(--success); color: var(--success); display: block; }
    
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: #060911; padding: 0.75rem 1rem; text-align: left; font-size: 0.75rem; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); }
    .text-right { text-align: right; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Trading 212 <span>Dashboard</span></h1>
    <button id="btnFetch">Aktualisieren</button>
  </header>

  <div id="statusBox" class="status"></div>

  <details class="card" id="configDrawer" open>
    <summary style="font-size: 0.9rem; font-weight: 600; color: var(--accent); cursor: pointer; margin-bottom: 1rem;">
      Zugangsdaten & Worker-URL
    </summary>
    <div class="form-row">
      <div>
        <label for="proxyUrl">Cloudflare Worker URL</label>
        <input type="text" id="proxyUrl" value="https://t212.22144.workers.dev/">
      </div>
      <div>
        <label for="apiKey">API Key</label>
        <input type="text" id="apiKey" placeholder="Key ID">
      </div>
      <div>
        <label for="apiSecret">API Secret</label>
        <input type="password" id="apiSecret" placeholder="Secret Token">
      </div>
    </div>
    <div class="btn-group">
      <button class="secondary" id="btnSave">Speichern</button>
      <button class="danger" id="btnClear">Reset / Löschen</button>
    </div>
  </details>

  <div class="kpi-grid" id="kpiArea" style="display: none;">
    <div class="kpi-card">
      <div class="kpi-title">Investments Value</div>
      <div class="kpi-val" id="kpiInvestments">0,00 €</div>
      <div class="kpi-sub">Cost: <span id="kpiCost">0,00 €</span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Return</div>
      <div class="kpi-val" id="kpiReturn">0,00 €</div>
      <div class="kpi-sub" id="kpiReturnPct">0.00%</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Main Pot (Cash)</div>
      <div class="kpi-val" id="kpiCash">0,00 €</div>
      <div class="kpi-sub"><span id="kpiCount">0</span> Positionen</div>
    </div>
  </div>

  <div class="card" id="tableCard" style="display: none; padding: 0; overflow: hidden;">
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Ticker</th>
            <th class="text-right">Anteile</th>
            <th class="text-right">Kaufkurs</th>
            <th class="text-right">Aktueller Kurs</th>
            <th class="text-right">Return (EUR)</th>
          </tr>
        </thead>
        <tbody id="portfolioTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Direkter On-Screen Debugger für iOS / Chrome iPad
  window.onerror = function(msg, url, line) {
    const box = document.getElementById('statusBox');
    if (box) {
      box.textContent = 'Script-Fehler: ' + msg + ' (Zeile: ' + line + ')';
      box.className = 'status error';
    }
  };

  const STORAGE_KEY = 't212_clean_cfg';
  const proxyUrlEl = document.getElementById('proxyUrl');
  const apiKeyEl = document.getElementById('apiKey');
  const apiSecretEl = document.getElementById('apiSecret');
  const statusBox = document.getElementById('statusBox');
  const configDrawer = document.getElementById('configDrawer');
  const kpiArea = document.getElementById('kpiArea');
  const tableCard = document.getElementById('tableCard');
  const portfolioTable = document.getElementById('portfolioTable');

  function showStatus(text, type) {
    statusBox.textContent = text;
    statusBox.className = 'status ' + type;
  }

  function clearStatus() {
    statusBox.style.display = 'none';
  }

  function formatEur(val) {
    return Number(val || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  }

  // Laden beim Start
  window.addEventListener('DOMContentLoaded', () => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const cfg = JSON.parse(saved);
        if (cfg.proxy) proxyUrlEl.value = cfg.proxy;
        if (cfg.key) apiKeyEl.value = cfg.key;
        if (cfg.secret) apiSecretEl.value = cfg.secret;
        if (cfg.key && cfg.secret) {
          configDrawer.removeAttribute('open');
          fetchPortfolio();
        }
      }
    } catch (e) {
      localStorage.removeItem(STORAGE_KEY);
    }
  });

  // Speichern
  document.getElementById('btnSave').addEventListener('click', () => {
    const proxy = proxyUrlEl.value.trim();
    const key = apiKeyEl.value.trim();
    const secret = apiSecretEl.value.trim();
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ proxy, key, secret }));
    showStatus('Gespeichert. Lade Daten...', 'success');
    fetchPortfolio();
  });

  // Löschen
  document.getElementById('btnClear').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    apiKeyEl.value = '';
    apiSecretEl.value = '';
    kpiArea.style.display = 'none';
    tableCard.style.display = 'none';
    showStatus('Zugangsdaten wurden entfernt.', 'success');
  });

  document.getElementById('btnFetch').addEventListener('click', fetchPortfolio);

  async function fetchPortfolio() {
    clearStatus();
    let proxy = proxyUrlEl.value.trim();
    const key = apiKeyEl.value.trim();
    const secret = apiSecretEl.value.trim();

    if (!proxy || !key || !secret) {
      configDrawer.setAttribute('open', 'true');
      showStatus('Bitte Worker-URL, API Key und Secret angeben.', 'error');
      return;
    }

    if (!proxy.startsWith('http://') && !proxy.startsWith('https://')) {
      proxy = 'https://' + proxy;
    }

    // Sofort persistent hinterlegen
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ proxy, key, secret }));

    showStatus('Verbindung zu Trading 212 wird aufgebaut...', 'success');
    const authHeader = 'Basic ' + btoa(key + ':' + secret);

    try {
      const res = await fetch(proxy, {
        method: 'GET',
        headers: { 'Authorization': authHeader }
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error('HTTP ' + res.status + ': ' + errText.slice(0, 100));
      }

      const raw = await res.json();
      renderAll(raw);
      clearStatus();
    } catch (err) {
      showStatus('Fehler beim Abruf: ' + err.message, 'error');
    }
  }

  function renderAll(data) {
    let portfolio = [];
    let summary = null;

    if (Array.isArray(data)) {
      portfolio = data;
    } else if (data && typeof data === 'object') {
      portfolio = Array.isArray(data.portfolio) ? data.portfolio : [];
      summary = data.summary || null;
    }

    let invested = 0;
    let ret = 0;
    let free = 0;

    if (summary && typeof summary.invested !== 'undefined') {
      invested = Number(summary.invested || 0);
      ret = Number(summary.ppl || 0);
      free = Number(summary.free || 0);
    } else {
      portfolio.forEach(p => {
        ret += Number(p.ppl || 0);
      });
      // Fallback
      invested = 400.00;
    }

    const val = invested + ret;
    const pct = invested > 0 ? (ret / invested) * 100 : 0;

    document.getElementById('kpiInvestments').textContent = formatEur(val);
    document.getElementById('kpiCost').textContent = formatEur(invested);
    document.getElementById('kpiCash').textContent = formatEur(free);
    document.getElementById('kpiCount').textContent = portfolio.length;

    const returnEl = document.getElementById('kpiReturn');
    const pctEl = document.getElementById('kpiReturnPct');
    returnEl.textContent = (ret >= 0 ? '+' : '') + formatEur(ret);
    pctEl.textContent = (ret >= 0 ? '+' : '') + pct.toFixed(2) + '%';
    pctEl.className = 'kpi-sub badge ' + (ret >= 0 ? 'up' : 'down');
    returnEl.style.color = ret >= 0 ? 'var(--success)' : 'var(--danger)';

    kpiArea.style.display = 'grid';

    // Tabelle füllen
    portfolioTable.innerHTML = '';
    if (portfolio.length === 0) {
      portfolioTable.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 1.5rem; color: var(--text-muted);">Keine Positionen gefunden.</td></tr>';
    } else {
      portfolio.forEach(p => {
        const qty = Number(p.quantity || 0);
        const avg = Number(p.averagePrice || 0);
        const cur = Number(p.currentPrice || 0);
        const ppl = Number(p.ppl || 0);
        const ticker = (p.ticker || '-').replace(/_US_EQ|_EQ/g, '');

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${ticker}</strong> <span style="font-size:0.75rem; color:var(--text-muted);">${p.ticker}</span></td>
          <td class="text-right">${qty.toLocaleString('de-DE', { maximumFractionDigits: 4 })}</td>
          <td class="text-right">${avg.toFixed(2)}</td>
          <td class="text-right" style="font-weight: 600;">${cur.toFixed(2)}</td>
          <td class="text-right">
            <span class="badge ${ppl >= 0 ? 'up' : 'down'}">
              ${ppl >= 0 ? '+' : ''}${formatEur(ppl)}
            </span>
          </td>
        `;
        portfolioTable.appendChild(tr);
      });
    }
    tableCard.style.display = 'block';
  }
</script>
</body>
</html>
