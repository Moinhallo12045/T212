<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading 212 Dividenden Radar</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #4ade80;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1.5rem; line-height: 1.5; }
    .container { max-width: 900px; margin: 0 auto; }
    header { margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 0.6rem 0.8rem; background: #0b1120; border: 1px solid var(--border);
      border-radius: 6px; color: #fff; font-size: 0.9rem;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
    .checkbox-group { display: flex; align-items: center; gap: 0.5rem; margin: 0.75rem 0; font-size: 0.85rem; }
    .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    button {
      background: var(--accent); color: #000; border: none; border-radius: 6px;
      padding: 0.6rem 1rem; font-weight: 600; cursor: pointer; transition: 0.15s ease-in-out;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: #334155; color: var(--text); }
    button.secondary:hover { background: #475569; }
    button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    button.danger:hover { background: var(--danger); color: #000; }
    .status { padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; display: none; }
    .status.error { background: rgba(248, 113, 113, 0.15); border: 1px solid var(--danger); color: var(--danger); display: block; }
    .status.success { background: rgba(74, 222, 128, 0.15); border: 1px solid var(--success); color: var(--success); display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; }
    th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; }
    .text-right { text-align: right; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Trading 212 Dividenden Radar</h1>
    <p style="color: var(--text-muted); font-size: 0.85rem;">Live-Verbindung via Cloudflare Tunnel</p>
  </header>

  <div class="card">
    <div class="form-group">
      <label for="proxyUrl">Dein Cloudflare Worker URL</label>
      <input type="text" id="proxyUrl" value="https://t212.22144.workers.dev/">
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="apiKey">API Key (ID / Name)</label>
        <input type="text" id="apiKey" placeholder="z. B. MeinKey1">
      </div>
      <div class="form-group">
        <label for="apiSecret">API Secret</label>
        <input type="password" id="apiSecret" placeholder="Geheimer Schlüssel">
      </div>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="saveCredentials" checked>
      <label for="saveCredentials" style="margin-bottom: 0; cursor: pointer;">Zugangsdaten & Worker-URL auf diesem Gerät merken</label>
    </div>

    <div class="btn-group">
      <button id="btnFetch">Depot live laden</button>
      <button class="secondary" id="btnDemo">Demo-Daten laden</button>
      <button class="danger" id="btnClear">Keys löschen</button>
    </div>
  </div>

  <div id="statusBox" class="status"></div>

  <div class="card" id="resultCard" style="display: none;">
    <h2 style="font-size: 1.1rem; margin-bottom: 0.5rem;">Gefundene Positionen</h2>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Ticker</th>
            <th class="text-right">Anteile</th>
            <th class="text-right">Kaufkurs</th>
            <th class="text-right">Aktueller Kurs</th>
          </tr>
        </thead>
        <tbody id="portfolioTable"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 't212_live_config';
  const proxyUrlInput = document.getElementById('proxyUrl');
  const apiKeyInput = document.getElementById('apiKey');
  const apiSecretInput = document.getElementById('apiSecret');
  const saveCheckbox = document.getElementById('saveCredentials');
  const statusBox = document.getElementById('statusBox');
  const resultCard = document.getElementById('resultCard');
  const portfolioTable = document.getElementById('portfolioTable');

  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const { proxy, key, secret } = JSON.parse(saved);
        if (proxy) proxyUrlInput.value = proxy;
        apiKeyInput.value = key || '';
        apiSecretInput.value = secret || '';
        saveCheckbox.checked = !!localStorage.getItem(STORAGE_KEY);
      } catch (e) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }
  });

  function showStatus(msg, type = 'error') {
    statusBox.textContent = msg;
    statusBox.className = `status ${type}`;
    statusBox.style.display = 'block';
  }

  function clearStatus() {
    statusBox.style.display = 'none';
  }

  document.getElementById('btnClear').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    sessionStorage.removeItem(STORAGE_KEY);
    apiKeyInput.value = '';
    apiSecretInput.value = '';
    saveCheckbox.checked = false;
    resultCard.style.display = 'none';
    showStatus('Zugangsdaten wurden gelöscht.', 'success');
  });

  document.getElementById('btnFetch').addEventListener('click', async () => {
    clearStatus();
    let proxyUrl = proxyUrlInput.value.trim();
    const key = apiKeyInput.value.trim();
    const secret = apiSecretInput.value.trim();

    if (!proxyUrl) {
      showStatus('Bitte trage die URL deines Cloudflare Workers ein.', 'error');
      return;
    }
    if (!key || !secret) {
      showStatus('Bitte sowohl API Key als auch API Secret eingeben.', 'error');
      return;
    }

    if (!proxyUrl.startsWith('http://') && !proxyUrl.startsWith('https://')) {
      proxyUrl = 'https://' + proxyUrl;
    }

    const config = JSON.stringify({ proxy: proxyUrl, key, secret });
    if (saveCheckbox.checked) {
      localStorage.setItem(STORAGE_KEY, config);
      sessionStorage.removeItem(STORAGE_KEY);
    } else {
      sessionStorage.setItem(STORAGE_KEY, config);
      localStorage.removeItem(STORAGE_KEY);
    }

    const authHeader = 'Basic ' + btoa(`${key}:${secret}`);
    showStatus('Verbindung zu Trading 212 wird aufgebaut...', 'success');

    try {
      const res = await fetch(proxyUrl, {
        method: 'GET',
        headers: {
          'Authorization': authHeader
        }
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`HTTP ${res.status}: ${errText.slice(0, 120)}`);
      }

      const data = await res.json();
      renderPortfolio(data);
      showStatus(`${data.length} Positionen erfolgreich live geladen!`, 'success');
    } catch (err) {
      showStatus('Fehler beim Abruf: ' + err.message, 'error');
    }
  });

  function renderPortfolio(items) {
    portfolioTable.innerHTML = '';
    if (!items || items.length === 0) {
      portfolioTable.innerHTML = '<tr><td colspan="4" style="text-align: center;">Keine Positionen im Depot vorhanden.</td></tr>';
    } else {
      items.forEach(pos => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${pos.ticker || '-'}</strong></td>
          <td class="text-right">${Number(pos.quantity).toFixed(4)}</td>
          <td class="text-right">${pos.averagePrice ? Number(pos.averagePrice).toFixed(2) : '-'}</td>
          <td class="text-right">${pos.currentPrice ? Number(pos.currentPrice).toFixed(2) : '-'}</td>
        `;
        portfolioTable.appendChild(tr);
      });
    }
    resultCard.style.display = 'block';
  }

  document.getElementById('btnDemo').addEventListener('click', () => {
    clearStatus();
    const demoData = [
      { ticker: 'AAPL_US_EQ', quantity: 15.5, averagePrice: 175.20, currentPrice: 228.40 },
      { ticker: 'MSFT_US_EQ', quantity: 8.0, averagePrice: 320.10, currentPrice: 425.80 },
      { ticker: 'O_US_EQ', quantity: 50.0, averagePrice: 52.30, currentPrice: 56.10 }
    ];
    renderPortfolio(demoData);
    showStatus('Demo-Daten geladen.', 'success');
  });
</script>
</body>
</html>
